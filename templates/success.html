<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>southy</title>
    <style>
    body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #1e293b, #3b82f6);
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    }


    .success-container {
    text-align: center;
    }


    .card {
    background: white;
    padding: 40px;
    border-radius: 12px;
    width: 350px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }


    .checkmark {
    font-size: 50px;
    color: #22c55e;
    margin-bottom: 15px;
    }


    h1 {
    margin-bottom: 10px;
    }

    p {
    color: #555;
    }


    .info-box {
    background: #f1f5f9;
    padding: 15px;
    border-radius: 8px;
    margin: 20px 0;
    text-align: left;
    font-size: 14px;
    }


    .btn {
    display: inline-block;
    background: #3b82f6;
    color: white;
    padding: 12px 20px;
    border-radius: 6px;
    text-decoration: none;
    }

    .btn:hover {
    background: #2563eb;
    }
    
    </style>
</head>
<body>

<div class="success-container">
    
    <div class="card">
        <div class="checkmark">✔</div>

        <h1>Request Submitted!</h1>

        <p>
            Thank you for using <strong>Southy</strong>.  
            One of our team members will contact you shortly to assist with your request.
        </p>

        <div class="info-box">
            <p>📞 Please keep your phone nearby</p>

        </div>

        <a href="/" class="btn">Back to Home</a>
    </div>

</div>

</body>
</html>
