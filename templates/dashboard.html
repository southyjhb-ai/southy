{% extends 'base.html' %}
{% block content %}
<h2>All Jobs</h2>

{% for job in jobs %}
  <div style="border:1px solid #000; margin:10px; padding:10px;">
    <h3>{{ job.title }}</h3>
    <p>{{ job.description }}</p>
    <p><b>Client:</b> {{ job.name }}</p>
    <p><b>Phone:</b> {{ job.phone }}</p>
    <p><b>Location:</b> {{ job.location }}</p>
    <p><b>Budget:</b> {{ job.budget }}</p>
  </div>
{% endfor %}
{% endblock %}
